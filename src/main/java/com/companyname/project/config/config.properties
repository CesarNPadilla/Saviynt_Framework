#############################################
# Project Global Configuration
#############################################

# Default environment (can be overridden with Maven profiles: -Pdev, -Pstaging, -Pprod)
environment=dev

# Browser settings
browser=chrome
headless=false
implicitWait=10
explicitWait=20
pageLoadTimeout=30

# Base URL fallback (overridden by environment JSON if present)
base.url=https://acnllp-development.saviyntcloud.com/ECM/

# Reporting
allure.results.dir=target/allure-results
allure.report.dir=reports/allure-report

# Logging
log.level=INFO

# Retry mechanism for flaky tests
retry.count=2

# Parallel execution
parallel.execution=false
thread.count=4
