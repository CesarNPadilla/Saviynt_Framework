image: maven:3.9.6-eclipse-temurin-21

stages:
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-B -e -U -T 2C"

before_script:
  # Install Chrome for Selenium
  - apt-get update && apt-get install -y wget gnupg unzip curl
  - wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | apt-key add -
  - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
  - apt-get update && apt-get install -y google-chrome-stable
  - java -version
  - mvn -version

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

test-job:
  stage: test
  script:
      # Debug info to confirm AWS credentials and region (optional)
    - echo "AWS Region | $AWS_REGION"
    - if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "Missing AWS credentials"; exit 1; else echo "AWS credentials detected"; fi
    # Run Maven test suite
    - mvn clean test -Dbrowser=chrome -Denv=dev -Dcucumber.options="--tags @healthcheck"
  artifacts:
    when: always
    paths:
      - target/allure-results
      - target/cucumber-reports/
      - target/surefire-reports/
    expire_in: 1 week
