image: maven:3.9.6-eclipse-temurin-17

stages:
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-B -e -U -T 2C"

before_script:
  # Install Chrome for Selenium
  - apt-get update -qq
  - apt-get install -y wget gnupg unzip curl google-chrome-stable
  - java -version
  - mvn -version

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

test-job:
  stage: test
  script:
    - mvn clean test -Dbrowser=chrome -Denv=dev
  artifacts:
    when: always
    paths:
      - target/allure-results
      - target/cucumber-reports/
      - target/surefire-reports/
    expire_in: 1 week
